name: VERIFAI CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Backend Test Suite & Schema Verification
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r backend/requirements.txt

    - name: Download NLTK Corpora
      run: |
        python -c "import nltk; nltk.download('stopwords'); nltk.download('punkt'); nltk.download('punkt_tab')"

    - name: Configure Environment
      run: |
        cp backend/.env.example backend/.env

    - name: Verify Django System Checks
      working-directory: ./backend
      run: |
        python manage.py check

    - name: Run Database Migrations
      working-directory: ./backend
      run: |
        python manage.py migrate

    - name: Execute Automated Test Suite (33 Tests)
      working-directory: ./backend
      run: |
        python manage.py test --verbosity=2

    - name: Verify OpenAPI 3.0 Schema Compilation
      working-directory: ./backend
      run: |
        python manage.py spectacular --file schema.yml
        test -f schema.yml
