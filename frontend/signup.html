<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create an Account — VerifAI</title>
  <meta name="description" content="Set up verification access for your institute, newsroom, or organization.">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

  <!-- Site Navigation Header -->
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="brand-logo" aria-label="VerifAI Home">
        <span>VerifAI</span>
        <span class="brand-dot"></span>
      </a>

      <div class="nav-actions">
        <a href="login.html" class="btn btn-ghost btn-sm">Sign In</a>
      </div>
    </div>
  </header>

  <!-- Main Auth Body -->
  <main class="main-content">
    <div class="auth-wrapper">
      <div class="auth-card" style="max-width: 460px;">
        
        <div class="auth-header">
          <h1 class="auth-title">Create an Account</h1>
          <p class="auth-subtitle">Set up verification access for your institute or organization.</p>
        </div>

        <!-- Authentication Required Banner -->
        <div id="authRequiredAlert" class="auth-alert" style="display: none;">
          <span id="authAlertText">Please create an account to access the verification workbench.</span>
        </div>

        <form id="signupForm" class="auth-form">
          <div class="form-group">
            <label class="form-label" for="signupOrganization">Organization / Institute Name</label>
            <input type="text" id="signupOrganization" class="form-input" placeholder="e.g. Oxford University or Reuters" required autocomplete="organization">
          </div>

          <div class="form-group">
            <label class="form-label" for="signupName">Full Name</label>
            <input type="text" id="signupName" class="form-input" placeholder="e.g. Sarah Jenkins" required autocomplete="name">
          </div>

          <div class="form-group">
            <label class="form-label" for="signupEmail">Email</label>
            <input type="email" id="signupEmail" class="form-input" placeholder="name@organization.com" required autocomplete="email">
          </div>

          <div class="form-group">
            <label class="form-label" for="signupPassword">Password</label>
            <input type="password" id="signupPassword" class="form-input" placeholder="Create a secure password (min 6 characters)" required autocomplete="new-password">
          </div>

          <div class="form-group">
            <label class="form-label" for="signupConfirmPassword">Confirm Password</label>
            <input type="password" id="signupConfirmPassword" class="form-input" placeholder="Confirm your password" required autocomplete="new-password">
          </div>

          <button type="submit" id="submitSignupBtn" class="btn btn-primary btn-full btn-lg">
            Create Account
          </button>
        </form>

        <div class="auth-footer">
          Already have an account? <a href="login.html">Sign In</a>
        </div>

      </div>
    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container text-center" style="display: flex; justify-content: space-between; align-items: center;">
      <span style="font-size: 0.813rem; color: var(--text-muted);">&copy; 2026 VerifAI. All rights reserved.</span>
      <a href="index.html" style="font-size: 0.813rem; color: var(--text-secondary);">Back to Home</a>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
