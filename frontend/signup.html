<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — VerifAI</title>
  <meta name="description" content="Create a VerifAI account to start analyzing news authenticity.">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

  <!-- Navigation -->
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">VerifAI</a>
      <nav class="nav-menu" id="navMenu">
        <a href="index.html" class="nav-link">Home</a>
        <a href="detector.html" class="nav-link">News Test</a>
        <a href="about.html" class="nav-link">About</a>
        <a href="privacy.html" class="nav-link">Privacy</a>
        <a href="terms.html" class="nav-link">Terms</a>
      </nav>
      <div class="nav-actions" id="navAuthContainer">
        <a href="login.html" class="btn btn-ghost btn-sm">Login</a>
        <a href="signup.html" class="btn btn-primary btn-sm active">Sign Up</a>
      </div>
      <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle navigation">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- Signup Main -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <h1 class="auth-title">Create your account</h1>
        <p class="auth-subtitle">Get started with VerifAI news analysis.</p>
      </div>

      <form id="signupForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="signupName">Name</label>
          <input type="text" id="signupName" class="form-input" placeholder="Full name" required autocomplete="name">
        </div>

        <div class="form-group">
          <label class="form-label" for="signupEmail">Email</label>
          <input type="email" id="signupEmail" class="form-input" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="signupPassword">Password</label>
          <input type="password" id="signupPassword" class="form-input" placeholder="At least 6 characters" required autocomplete="new-password">
        </div>

        <button type="submit" id="submitSignupBtn" class="btn btn-primary btn-block" style="margin-top: 8px;">Sign Up</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="login.html">Sign In</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="footer-container">
      <div class="footer-brand">
        <div class="footer-logo">VerifAI</div>
        <p class="footer-tagline">Machine learning platform for estimating news authenticity.</p>
      </div>
      <div class="footer-links">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="privacy.html">Privacy</a>
        <a href="terms.html">Terms</a>
        <a href="login.html">Login</a>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; 2026 VerifAI. All rights reserved.</p>
    </div>
  </footer>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
