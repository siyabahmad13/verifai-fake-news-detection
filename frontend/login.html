<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — VerifAI</title>
  <meta name="description" content="Sign in to your VerifAI organization or institute account.">
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

  <!-- Site Navigation Header -->
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="brand-logo" aria-label="VerifAI Home">
        <span>VerifAI</span>
        <span class="brand-dot"></span>
      </a>

      <div class="nav-actions">
        <a href="signup.html" class="btn btn-secondary btn-sm">Create Account</a>
      </div>
    </div>
  </header>

  <!-- Main Auth Body -->
  <main class="main-content">
    <div class="auth-wrapper">
      <div class="auth-card">
        
        <div class="auth-header">
          <h1 class="auth-title">Sign in to VerifAI</h1>
          <p class="auth-subtitle">Enter your email and password to access your workspace.</p>
        </div>

        <!-- Authentication Required Banner -->
        <div id="authRequiredAlert" class="auth-alert" style="display: none;">
          <span id="authAlertText">Please sign in to access the verification workbench.</span>
        </div>

        <form id="loginForm" class="auth-form">
          <div class="form-group">
            <label class="form-label" for="emailInput">Email</label>
            <input type="email" id="emailInput" class="form-input" placeholder="name@organization.com" required autocomplete="email">
          </div>

          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
              <label class="form-label" for="passwordInput" style="margin-bottom: 0;">Password</label>
              <a href="#" onclick="showToast('Password reset link will be sent to your email.', 'info'); return false;" style="font-size: 0.813rem; color: var(--text-muted); text-decoration: underline;">
                Forgot password?
              </a>
            </div>
            <div style="position: relative;">
              <input type="password" id="passwordInput" class="form-input" placeholder="Enter your password" required autocomplete="current-password">
              <button type="button" id="togglePasswordBtn" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; font-size: 0.75rem; color: var(--text-muted); cursor: pointer;">
                Show
              </button>
            </div>
          </div>

          <div style="display: flex; align-items: center; margin-bottom: 20px;">
            <label style="display: flex; align-items: center; gap: 8px; font-size: 0.875rem; color: var(--text-secondary); cursor: pointer;">
              <input type="checkbox" id="rememberMeCheck" checked>
              <span>Remember me</span>
            </label>
          </div>

          <button type="submit" id="submitLoginBtn" class="btn btn-primary btn-full btn-lg">
            Sign In
          </button>
        </form>

        <div class="auth-footer">
          Don't have an account? <a href="signup.html">Create an account</a>
        </div>

      </div>
    </div>
  </main>

  <!-- Site Footer -->
  <footer class="site-footer">
    <div class="container text-center" style="display: flex; justify-content: space-between; align-items: center;">
      <span style="font-size: 0.813rem; color: var(--text-muted);">&copy; 2026 VerifAI. All rights reserved.</span>
      <a href="index.html" style="font-size: 0.813rem; color: var(--text-secondary);">Back to Home</a>
    </div>
  </footer>

  <!-- Scripts -->
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
